<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generate Reports | NJOYAKO Event Management</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="reports.css" />
</head>
<body>

  <header class="navbar">
    <h1><i class="fa-solid fa-chart-line"></i> Generate Reports</h1>
    <button id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
  </header>

  <main>
    <div class="container">
      <!-- Back to Dashboard -->
      <div style="text-align:center; margin-bottom:1rem;">
        <button id="backBtn" class="btn"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</button>
      </div>

      <h2>Event Reports</h2>
      <p class="subtitle">View event performance, attendance and revenue summaries.</p>

      <div class="form-group">
        <label for="eventSelect">Select Event:</label>
        <select id="eventSelect">
          <option value="">-- Choose an Event --</option>
          <option>Annual Music Festival</option>
          <option>Tech Conference 2025</option>
          <option>Charity Gala</option>
        </select>
      </div>

      <button id="generateBtn" class="btn"><i class="fa-solid fa-chart-pie"></i> Generate Report</button>

      <div id="reportSection" class="report-section hidden">
        <h3>Event Summary</h3>

        <div class="report-grid">
          <div class="card">
            <i class="fa-solid fa-users"></i>
            <h4>Total Guests</h4>
            <p id="totalGuests">0</p>
          </div>

          <div class="card">
            <i class="fa-solid fa-user-check"></i>
            <h4>Confirmed Attendees</h4>
            <p id="confirmedGuests">0</p>
          </div>

          <div class="card">
            <i class="fa-solid fa-dollar-sign"></i>
            <h4>Total Revenue</h4>
            <p id="totalRevenue">$0.00</p>
          </div>

          <div class="card">
            <i class="fa-solid fa-chart-column"></i>
            <h4>Attendance Rate</h4>
            <p id="attendanceRate">0%</p>
          </div>
        </div>

        <div class="chart-container">
          <canvas id="attendanceChart"></canvas>
        </div>

        <div class="actions">
          <button id="printBtn" class="btn"><i class="fa-solid fa-print"></i> Print Report</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 NJOYAKO Entertainment | All Rights Reserved</p>
  </footer>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const role = localStorage.getItem('role') || 'user';
      if (role !== 'organiser') {
        window.location.href = 'dashboard1.html';
        return;
      }

      const eventSelect = document.getElementById('eventSelect');
      const reportSection = document.getElementById('reportSection');
      const generateBtn = document.getElementById('generateBtn');
      const totalGuests = document.getElementById('totalGuests');
      const confirmedGuests = document.getElementById('confirmedGuests');
      const totalRevenue = document.getElementById('totalRevenue');
      const attendanceRate = document.getElementById('attendanceRate');

      // Logout button
      document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('role');
        window.location.href = 'index.html';
      });

      // Back button
      document.getElementById('backBtn').addEventListener('click', () => {
        window.location.href = 'dashboard2.html';
      });

      // Generate report
      generateBtn.addEventListener('click', () => {
        const eventName = eventSelect.value;
        if (!eventName) {
          alert('Please select an event first.');
          return;
        }

        // Simulated data
        const reportData = {
          "Annual Music Festival": { guests: 200, confirmed: 160, revenue: 8000 },
          "Tech Conference 2025": { guests: 300, confirmed: 270, revenue: 15000 },
          "Charity Gala": { guests: 150, confirmed: 120, revenue: 5000 }
        };

        const data = reportData[eventName];
        totalGuests.textContent = data.guests;
        confirmedGuests.textContent = data.confirmed;
        totalRevenue.textContent = `$${data.revenue.toLocaleString()}`;
        attendanceRate.textContent = `${((data.confirmed / data.guests) * 100).toFixed(1)}%`;

        reportSection.classList.remove('hidden');

        // Chart
        const ctx = document.getElementById('attendanceChart');
        new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: ['Confirmed', 'Absent'],
            datasets: [{
              data: [data.confirmed, data.guests - data.confirmed],
              backgroundColor: ['#4b6cb7', '#ccc']
            }]
          },
          options: {
            responsive: true,
            plugins: { legend: { position: 'bottom' } }
          }
        });
      });

      // Print report
      document.getElementById('printBtn').addEventListener('click', () => {
        window.print();
      });
    });
  </script>

</body>
</html>
