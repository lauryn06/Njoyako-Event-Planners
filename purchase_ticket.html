<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purchase Ticket | NJOYAKO Event Management</title>
  <link rel="stylesheet" href="purchase_ticket.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <header class="navbar">
    <h1><i class="fa-solid fa-ticket"></i> Purchase Ticket</h1>
    <button class="back-btn" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</button>
  </header>

  <main class="ticket-container">
    <section class="purchase-form">
      <h2>Select Event & Purchase Ticket</h2>

      <form id="ticketForm">
        <label for="eventSelect">Event:</label>
        <select id="eventSelect" required>
          <option value="">-- Select Event --</option>
          <option value="musicFest">Annual Music Festival</option>
          <option value="techCon">Tech Conference 2025</option>
          <option value="charityGala">Charity Gala Night</option>
        </select>

        <label for="ticketType">Ticket Type:</label>
        <select id="ticketType" required>
          <option value="">-- Select Type --</option>
          <option value="regular">Regular - MK10,000</option>
          <option value="vip">VIP - MK25,000</option>
          <option value="vvip">VVIP - MK40,000</option>
        </select>

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" min="1" value="1" required>

        <button type="submit" class="purchase-btn">Purchase</button>
        <p id="message"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 NJOYAKO Entertainment | All Rights Reserved</p>
  </footer>

  <script>
    const prices = {
      regular: 10000,
      vip: 25000,
      vvip: 40000
    };

    document.getElementById('ticketForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const event = document.getElementById('eventSelect').value;
      const type = document.getElementById('ticketType').value;
      const qty = parseInt(document.getElementById('quantity').value);
      const message = document.getElementById('message');

      if (!event || !type || qty < 1) {
        message.style.color = 'red';
        message.textContent = 'Please complete all fields.';
        return;
      }

      const total = prices[type] * qty;
      message.style.color = 'green';
      message.textContent = `Purchase successful! Total amount: MK${total.toLocaleString()}`;

      // Example: Save to local storage (temporary)
      const purchase = { event, type, qty, total };
      localStorage.setItem('lastPurchase', JSON.stringify(purchase));
    });

    function goBack() {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
