<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customize Event | NJOYAKO Event Management</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="customize_event.css" />
</head>
<body>

  <header class="navbar">
    <h1><i class="fa-solid fa-sliders"></i> Customize Event</h1>
    <button id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
  </header>

  <main>
    <div class="form-container">
      <h2>Edit Existing Event</h2>

      <!-- Back to Dashboard -->
      <div style="text-align:center; margin-bottom:1rem;">
        <button id="backBtn" class="btn"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</button>
      </div>

      <div id="message"></div>

      <!-- Select event to edit -->
      <div class="form-group">
        <label for="eventSelect">Select Event</label>
        <select id="eventSelect" required>
          <option value="">-- Select Event --</option>
          <option>Annual Music Festival</option>
          <option>Tech Conference 2025</option>
          <option>Charity Gala</option>
        </select>
      </div>

      <!-- Editable event details -->
      <form id="customizeEventForm">
        <div class="form-group">
          <label for="title">Event Title</label>
          <input type="text" id="title" required>
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" rows="4" required></textarea>
        </div>

        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" required>
        </div>

        <div class="form-group">
          <label for="time">Time</label>
          <input type="time" id="time" required>
        </div>

        <div class="form-group">
          <label for="location">Location</label>
          <input type="text" id="location" required>
        </div>

        <div class="form-group">
          <label for="image">Change Event Image</label>
          <input type="file" id="image" accept="image/*">
        </div>

        <div class="form-group">
          <button type="submit" class="btn"><i class="fa-solid fa-save"></i> Save Changes</button>
        </div>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 NJOYAKO Entertainment | All Rights Reserved</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const role = localStorage.getItem('role') || 'user';
      if (role !== 'organiser') {
        window.location.href = 'dashboard.html';
        return;
      }

      // Logout
      document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('role');
        window.location.href = 'index.html';
      });

      // Back to dashboard
      document.getElementById('backBtn').addEventListener('click', () => {
        window.location.href = 'dashboard1.html';
      });

      const form = document.getElementById('customizeEventForm');
      const message = document.getElementById('message');
      const eventSelect = document.getElementById('eventSelect');

      // Load event details when selected
      eventSelect.addEventListener('change', () => {
        if (eventSelect.value === 'Annual Music Festival') {
          document.getElementById('title').value = 'Annual Music Festival';
          document.getElementById('description').value = 'A festival celebrating music and arts in Malawi.';
          document.getElementById('date').value = '2025-10-20';
          document.getElementById('time').value = '18:00';
          document.getElementById('location').value = 'Blantyre Stadium';
        } else if (eventSelect.value === 'Tech Conference 2025') {
          document.getElementById('title').value = 'Tech Conference 2025';
          document.getElementById('description').value = 'A gathering for innovators, developers, and entrepreneurs.';
          document.getElementById('date').value = '2025-11-05';
          document.getElementById('time').value = '09:00';
          document.getElementById('location').value = 'Lilongwe BICC';
        } else {
          form.reset();
        }
      });

      // Handle form submission
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        message.style.color = 'green';
        message.textContent = 'Event details updated successfully!';
      });
    });
  </script>
</body>
</html>
